<div class="page-container">
  <div class="header-actions">
    <h2>User Administration</h2>
    <button mat-raised-button color="primary">Create User</button>
  </div>

  <mat-card>
    <table mat-table [dataSource]="users" class="mat-elevation-z8">
      
      <!-- Name & Username Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> User </th>
        <td mat-cell *matCellDef="let user"> 
          <strong>{{user.name}}</strong><br>
          <small class="text-muted">&#64;{{user.username}}</small>
        </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let user"> {{user.email}} </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let user"> 
          <span class="status-badge" 
                [ngClass]="{
                  'badge-pending': user.status === 'PENDING_VERIFICATION',
                  'badge-active': user.status === 'ACTIVE',
                  'badge-suspended': user.status === 'SUSPENDED'
                }">
            {{user.status}}
          </span>
        </td>
      </ng-container>

      <!-- Current Roles Column -->
      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef> Current Roles </th>
        <td mat-cell *matCellDef="let user"> 
          <mat-chip-set>
            <mat-chip *ngFor="let role of user.roles" [color]="role.name === 'SYSTEM_ADMIN' ? 'accent' : 'primary'" highlighted>
              {{role.name}}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <!-- Role Assignment Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let user">
          <mat-form-field appearance="outline" class="role-select">
            <mat-label>Assign Role</mat-label>
            <mat-select (selectionChange)="updateUserRole(user.id, $event.value)">
              <mat-option *ngFor="let role of availableRoles" [value]="role.id">
                {{role.name}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          
          <button mat-button color="warn" *ngIf="user.status === 'ACTIVE'" (click)="updateStatus(user.id, 'SUSPENDED')">
            Suspend
          </button>
          <button mat-button color="primary" *ngIf="user.status === 'SUSPENDED'" (click)="updateStatus(user.id, 'ACTIVE')">
            Reactivate
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator 
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPageChange($event)">
    </mat-paginator>
  </mat-card>
</div>
